services:
  skyguard:
    build: .
    ports:
      - "8000:8000"
      - "8501:8501"
    env_file:
      - .env
    environment:
      # Image layout: package may sit in site-packages; paths must stay under /app.
      SKYGUARD_ROOT: /app
      SKYGUARD_DATA: /app/data
      # Server-side polls stay inside the container. SKYGUARD_PUBLIC_API comes from .env.
      SKYGUARD_API: http://127.0.0.1:8000
      SKYGUARD_DB: /var/lib/skyguard/skyguard.db
    volumes:
      - skyguard-data:/var/lib/skyguard
    restart: unless-stopped

volumes:
  skyguard-data:
